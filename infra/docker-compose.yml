name: orbitspace

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbit-local}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-minio-password}

services:
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: orbitspace
      MYSQL_USER: orbitspace
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-only-app-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-only-root-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    networks: [default, git_fetch_isolated]
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${ORBIT_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    networks: [default, git_fetch_isolated]
    build:
      context: ./minio
      target: server
    environment: *minio-env
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    build:
      context: ./minio
      target: client
    depends_on:
      minio:
        condition: service_healthy
    environment: *minio-env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/orbitspace-private
        mc anonymous set none local/orbitspace-private

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  nginx:
    build: ./nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - local-tls:/etc/nginx/local-tls

  server:
    networks: [default, git_fetch_isolated]
    profiles: [fullstack, p2, p3]
    build: ../apps/server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      ORBIT_GIT_TRUSTED_HOSTS: &git-hosts ${ORBIT_GIT_TRUSTED_HOSTS:-github.com,gitlab.com,bitbucket.org}
      ORBIT_GIT_KEY_VERSION: ${ORBIT_GIT_KEY_VERSION:-1}
      ORBIT_GIT_KEY_V1: ${ORBIT_GIT_KEY_V1:-bG9jYWwtb25seS1kZXYtZ2l0LWtlay12MS0wMTIzNDU=}
      ORBIT_AUTH_JWT_KEY: ${ORBIT_AUTH_JWT_KEY:-bG9jYWwtb25seS1kZXYtand0LWtleS12MS0wMTIzNDU=}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orbitspace
      SPRING_DATASOURCE_USERNAME: orbitspace
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-local-only-app-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      ORBIT_PUBLIC_ORIGIN: https://localhost:8443
      ORBIT_S3_ENDPOINT: http://minio:9000
      ORBIT_S3_BUCKET: orbitspace-private
      ORBIT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-orbit-local}
      ORBIT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-only-minio-password}
      ORBIT_INTERNAL_HMAC_SECRET: ${ORBIT_INTERNAL_HMAC_SECRET:-local-only-internal-hmac-secret}

  web:
    profiles: [fullstack, p2, p3]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile

  worker-py:
    profiles: [p2, p3]
    build: ../services/worker-py
    depends_on:
      server:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [git_fetch_isolated]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: server,redis,minio
      ORBIT_GIT_TRUSTED_HOSTS: *git-hosts
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: http.sslVerify
      GIT_CONFIG_VALUE_0: "true"
      GIT_CONFIG_KEY_1: http.followRedirects
      GIT_CONFIG_VALUE_1: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ORBIT_REDIS_HOST: redis
      ORBIT_REDIS_PORT: 6379
      ORBIT_REDIS_STREAM: orbit:async:jobs
      ORBIT_REDIS_GROUP: orbit-worker-py
      ORBIT_WORKER_STREAM_KEY: orbit:async:jobs
      ORBIT_WORKER_CONSUMER_GROUP: orbit-worker-py
      ORBIT_S3_ENDPOINT: http://minio:9000
      ORBIT_S3_BUCKET: orbitspace-private
      ORBIT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-orbit-local}
      ORBIT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-only-minio-password}
      ORBIT_SERVER_INTERNAL_URL: ${ORBIT_SERVER_INTERNAL_URL:-http://server:8080}
      ORBIT_INTERNAL_BASE_URL: ${ORBIT_INTERNAL_BASE_URL:-http://server:8080/internal/v1}
      ORBIT_INTERNAL_HMAC_SECRET: ${ORBIT_INTERNAL_HMAC_SECRET:-local-only-internal-hmac-secret}
    mem_limit: 512m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  collab-hocuspocus:
    profiles: [p3]
    build:
      context: ..
      dockerfile: services/collab-hocuspocus/Dockerfile
    depends_on:
      server:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      PORT: 1234
      ORBIT_PUBLIC_ORIGIN: https://localhost:8443
      ORBIT_SERVER_INTERNAL_URL: http://server:8080
      ORBIT_INTERNAL_HMAC_SECRET: ${ORBIT_INTERNAL_HMAC_SECRET:-local-only-internal-hmac-secret}
      ORBIT_REDIS_HOST: redis

  egress-proxy:
    profiles: [p3]
    build: ./egress-proxy
    networks: [git_fetch_isolated, git_egress]
    environment:
      ORBIT_GIT_TRUSTED_HOSTS: *git-hosts
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 64

networks:
  git_fetch_isolated:
    internal: true
  git_egress: {}

volumes:
  mysql-data:
  redis-data:
  minio-data:
  local-tls:
