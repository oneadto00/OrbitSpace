worker_processes auto;
events { worker_connections 1024; }

http {
    # Keep invite codes, one-use tickets and URL parameters out of access logs.
    log_format local '$remote_addr $request_method $status $body_bytes_sent';
    access_log /var/log/nginx/access.log local;
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Container services take precedence. In the middleware-only profile,
    # forward to the Spring Boot and Vite development servers on the host.
    upstream api_backend {
        zone api_backend 256k;
        server server:8080 resolve;
        server host.docker.internal:8080 backup;
    }
    upstream web_backend {
        zone web_backend 256k;
        server web:80 resolve;
        server host.docker.internal:5173 backup;
    }

    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/local-tls/localhost.crt;
        ssl_certificate_key /etc/nginx/local-tls/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 32m;

        if ($http_host != "localhost:8443") { return 421; }
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location /api/ {
            proxy_pass http://api_backend;
        }
        location = /ws/chat {
            if ($http_origin != "https://localhost:8443") { return 403; }
            if ($args !~ "^ticket=[A-Za-z0-9_-]+$") { return 400; }
            proxy_read_timeout 75s;
            proxy_pass http://api_backend;
        }
        location = /collab {
            if ($http_origin != "https://localhost:8443") { return 403; }
            if ($http_upgrade !~* "^websocket$") { return 400; }
            if ($args != "") { return 400; }
            # Optional profile. Resolve on request so the P1/P2 proxy can start independently.
            set $collab_backend collab-hocuspocus:1234;
            proxy_read_timeout 75s;
            proxy_pass http://$collab_backend;
        }
        location /ws/ { return 404; }
        location / { proxy_pass http://web_backend; }
    }
}
