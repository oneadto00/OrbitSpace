[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-worker"
version = "0.1.0"
description = "OrbitSpace P2 Redis Streams async worker for diff enrichment and safe thumbnails"
requires-python = ">=3.9"
dependencies = [
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.25.3,<2",
]

[project.scripts]
orbit-worker = "orbit_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
